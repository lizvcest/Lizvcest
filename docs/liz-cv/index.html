<script>
'use strict';
const form = document.querySelector('form');
const password = document.getElementById('password');
const button = form.querySelector('button');
const status = document.getElementById('status');
const payload = JSON.parse(document.getElementById('cv-payload').textContent);
const decode = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
form.addEventListener('submit', async event => {
  event.preventDefault();
  if (!window.crypto || !window.crypto.subtle) {
    status.textContent = 'Abrí esta página mediante HTTPS o localhost para desbloquear el CV.';
    return;
  }
  button.disabled = true;
  status.textContent = 'Desbloqueando…';
  try {
    const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password.value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: decode(payload.salt), iterations: 600000, hash: 'SHA-256'}, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const decrypted = await crypto.subtle.decrypt({name: 'AES-GCM', iv: decode(payload.iv)}, key, decode(payload.data));
    password.value = '';
    document.open();
    document.write(new TextDecoder().decode(decrypted));
    document.close();
  } catch (error) {
    status.textContent = 'No se pudo desbloquear el CV. Revisá la contraseña e intentá de nuevo.';
    password.value = '';
    password.focus();
  } finally {
    button.disabled = false;
  }
});
</script>
